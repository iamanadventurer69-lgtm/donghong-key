name: Deploy web to GitHub Pages

# 只有网页版会发布到 Pages（小程序版不进这个流程）。
# 首次使用：仓库 Settings → Pages → Source 选「GitHub Actions」，然后推 main 分支。
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'miniprogram/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 先跑一遍静态检查与单元测试，挂了就不发布
      - name: 静态检查
        run: node tests/check.js
      - name: 单元测试
        run: node --test tests/*.test.js
      - name: 构建网页版（零依赖，把共享内核打包进 web/）
        run: node tools/build-web.mjs
      # 给 js/css 加内容哈希（canvas.js?v=8f3a1c22）：GitHub Pages 每个文件都缓存
      # 10 分钟，不改 URL 的话用户刷新拿到的还是旧文件
      - name: 给静态资源加版本号
        run: node tools/stamp-assets.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
